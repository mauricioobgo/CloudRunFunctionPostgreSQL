name: Atlas Apply Cloud SQL

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "atlas_fastapi_sample/**"
      - "atlas_infra/**"
      - ".github/workflows/atlas-apply-cloudsql.yml"

permissions:
  contents: read
  id-token: write

# =========================================================
# GLOBAL CONFIGURATION (Zero Hardcoding)
# =========================================================
env:
  # Application & Infrastructure Paths
  PYTHON_VERSION: "3.12"
  APP_DIR: "./atlas_fastapi_sample"
  INFRA_DIR: "./atlas_infra"
  
  # Cloud SQL Proxy Config
  PROXY_VERSION: "v2.14.3"
  PROXY_HOST: "127.0.0.1"
  PROXY_PORT: "5432"
  
  # Set this in GitHub (Settings > Environments > Variables) or let it use the fallback
  INSTANCE_CONNECTION_NAME: ${{ vars.INSTANCE_CONNECTION_NAME || 'testing-atlas-setup:us-east4:atlas-instance-test' }}

  # Ephemeral CI Database Config
  # Set these in GitHub Variables/Secrets, or it will safely default for the throwaway container
  TEST_DB_USER: ${{ vars.TEST_DB_USER || 'postgres' }}
  TEST_DB_PASS: ${{ secrets.TEST_DB_PASS || 'password' }}
  TEST_DB_NAME: ${{ vars.TEST_DB_NAME || 'test_db' }}
  TEST_DB_PORT: ${{ vars.TEST_DB_PORT || '5432' }}

jobs:
  # =========================================================
  # JOB 1: CI (Lint & Test) - Runs Automatically
  # =========================================================
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          # The container boots securely using the workflow-level variables
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASS }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - ${{ env.TEST_DB_PORT }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # URLs built dynamically for Atlas
      TEST_DB_URL: "postgres://${{ env.TEST_DB_USER }}:${{ env.TEST_DB_PASS }}@127.0.0.1:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?search_path=public&sslmode=disable"
      DEV_URL: "docker://postgres/16/dev?search_path=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Application & Test Dependencies
        run: |
          pip install -e ${{ env.APP_DIR }}
          pip install pytest

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0

      - name: Atlas Migrate Lint (Safety Check)
        working-directory: ${{ env.INFRA_DIR }}
        run: atlas migrate lint --env local --latest 1

      - name: Apply Migrations to Ephemeral Test DB
        working-directory: ${{ env.INFRA_DIR }}
        run: atlas migrate apply --url ${{ env.TEST_DB_URL }} --dir "file://migrations"

      - name: Run Application Tests (Pytest)
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }} 
        run: pytest ${{ env.APP_DIR }}/tests/ -v 

  # =========================================================
  # JOB 2: CD (Deploy) - Pauses for Ad-Hoc Approval
  # =========================================================
  apply:
    needs: lint-and-test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # THIS IS THE GATE: Halts execution until approved in the GitHub UI
    environment: production 

    env:
      # Injecting secure production credentials
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DEV_URL: "docker://postgres/16/dev?search_path=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0

      - name: Download Cloud SQL Auth Proxy
        run: |
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${{ env.PROXY_VERSION }}/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy --address ${{ env.PROXY_HOST }} --port ${{ env.PROXY_PORT }} "${{ env.INSTANCE_CONNECTION_NAME }}" > proxy.log 2>&1 &
          for i in {1..20}; do
            nc -z ${{ env.PROXY_HOST }} ${{ env.PROXY_PORT }} && exit 0
            sleep 1
          done
          echo "Cloud SQL proxy failed to start"
          cat proxy.log
          exit 1

      - name: Apply Atlas Migrations to Production
        working-directory: ${{ env.INFRA_DIR }}
        env:
          # Final connection string built dynamically for Cloud SQL
          DB_URL: "postgres://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@${{ env.PROXY_HOST }}:${{ env.PROXY_PORT }}/${{ env.DB_NAME }}?search_path=app&sslmode=disable"
        run: atlas migrate apply --env local