lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_USER: postgres
      TEST_DB_NAME: app_db
      TEST_DB_PASS: postgres
      TEST_DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "atlas_fastapi_sample/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      
      # 🚨 FIX 1: The 'uv' Path Export
      - name: Install app dependencies
        run: |
          uv sync --project atlas_fastapi_sample/pyproject.toml
          # This forces GitHub Actions to use the uv virtual environment globally
          # so Atlas can actually find 'sqlmodel' in the next steps!
          echo "${{ github.workspace }}/atlas_fastapi_sample/.venv/bin" >> $GITHUB_PATH

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0
      
      - name: Build test DB URL
        run: echo "TEST_DB_URL=postgres://${{ env.TEST_DB_USER }}:${{ env.TEST_DB_PASS }}@127.0.0.1:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?sslmode=disable" >> "$GITHUB_ENV"

      # 🚨 FIX 2: The Strict Drift Enforcement ("--check")
      - name: Enforce Migration Sync (Check for Drift)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          # 1. Ask Atlas to calculate the diff. 
          # (If atlas.sum is broken, it will naturally fail here).
          atlas migrate diff ensure_sync --env local
          
          # 2. Check if Atlas had to create a new file in the runner.
          # If it did, it means the developer forgot to run 'diff' locally!
          if [ -n "$(git status --porcelain migrations/)" ]; then
            echo "🚨 ERROR: Schema drift detected!"
            echo "You modified the Python ORM models but forgot to run 'atlas migrate diff' locally."
            echo "Please run it locally and commit the generated .sql files."
            exit 1
          fi

      - name: Lint latest migration
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SQL migrations found; skipping lint"
            exit 0
          fi
          atlas migrate lint --env local --latest 1
        env:
          ATLAS_DEV_URL: ${{ env.DEV_URL }}
          ATLAS_URL: ${{ env.TEST_DB_URL }}

      - name: Apply migrations to ephemeral test DB
        run: atlas migrate apply --dir "file://${{ env.INFRA_DIR }}/migrations" --url "${{ env.TEST_DB_URL }}" --auto-approve --env local
