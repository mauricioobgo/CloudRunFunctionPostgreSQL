name: Atlas Apply Cloud SQL

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "atlas_fastapi_sample/**"
      - "atlas_infra/**"
      - ".github/workflows/atlas-apply-cloudsql.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      INSTANCE_CONNECTION_NAME: testing-atlas-setup:us-east4:atlas-instance-test
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DEV_URL: docker://postgres/16/dev?search_path=app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FastAPI app dependencies
        run: pip install -e ./atlas_fastapi_sample

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0

      - name: Install Atlas SQLAlchemy provider
        run: atlas provider install sqlalchemy

      - name: Download Cloud SQL Auth Proxy
        run: |
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 "$INSTANCE_CONNECTION_NAME" > proxy.log 2>&1 &
          for i in {1..20}; do
            nc -z 127.0.0.1 5432 && exit 0
            sleep 1
          done
          echo "Cloud SQL proxy failed to start"
          cat proxy.log
          exit 1

      - name: Apply Atlas migrations
        env:
          DB_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.DB_NAME }}?search_path=app&sslmode=disable
        run: atlas migrate apply --config "file://atlas_infra/atlas.hcl" --env local --auto-approve
