name: Atlas GCP

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply migrations to Cloud SQL after tests pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  APP_DIR: ./atlas_fastapi_sample
  INFRA_DIR: ./atlas_infra
  PROXY_VERSION: v2.14.3
  PROXY_HOST: ${{ secrets.INSTANCE_CONNECTION_NAME }}
  PROXY_PORT: 5432
  INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}
  DEV_URL: docker://postgres/16/dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_USER: postgres
      TEST_DB_NAME: dev
      TEST_DB_PASS: postgres
      TEST_DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "atlas_fastapi_sample/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      # 🚨 FIX 1: The 'uv' Path Export
      - name: Install app dependencies
        run: |
          uv sync --project atlas_fastapi_sample/pyproject.toml
          # This forces GitHub Actions to use the uv virtual environment globally
          # so Atlas can actually find 'sqlmodel' in the next steps!
          echo "${{ github.workspace }}/atlas_fastapi_sample/.venv/bin" >> $GITHUB_PATH

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0
      
      - name: Build test DB URL
        run: echo "TEST_DB_URL=docker://postgres/16/dev?search_path=public&sslmode=disable" >> "$GITHUB_ENV"

      - name: Enforce Migration Sync (Check for Drift)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          # 1. Ask Atlas to calculate the diff. 
          # (If atlas.sum is broken, it will naturally fail here).
          atlas migrate diff ensure_sync --env local

      - name: Apply migrations to ephemeral test DB
        working-directory: ${{ env.INFRA_DIR }}
        run: atlas migrate apply -u "${{ env.TEST_DB_URL }}" --env local