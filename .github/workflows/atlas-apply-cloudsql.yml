name: Atlas GCP

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply migrations to Cloud SQL after tests pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_DIR: ./atlas_fastapi_sample
  INFRA_DIR: ./atlas_infra
  PROXY_VERSION: v2.14.3
  PROXY_HOST: ${{ secrets.INSTANCE_CONNECTION_NAME }}
  PROXY_PORT: 5432
  INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}
  DEV_URL: docker://postgres/16/dev

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_USER: postgres
      TEST_DB_NAME: app_db
      TEST_DB_PASS: postgres
      TEST_DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "atlas_fastapi_sample/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Install app dependencies
        run: |
          uv sync --project atlas_fastapi_sample/pyproject.toml
          echo "${{ github.workspace }}/atlas_fastapi_sample/.venv/bin" >> $GITHUB_PATH

      - name: Setup Atlas CLI
        uses: ariga/setup-atlas@v0
      
      - name: Build test DB URL
        run: echo "TEST_DB_URL=postgres://${{ env.TEST_DB_USER }}:${{ env.TEST_DB_PASS }}@127.0.0.1:${{ env.TEST_DB_PORT }}/${{ env.TEST_DB_NAME }}?sslmode=disable" >> "$GITHUB_ENV"

      - name: Enforce Migration Sync (Check for Drift)
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          atlas migrate diff ensure_sync --env local

      - name: Apply migrations to ephemeral test DB
        working-directory: ${{ env.INFRA_DIR }}
        run: atlas migrate apply --url "${{ env.TEST_DB_URL }}" --env local

      # --- CLOUD SQL DEPLOYMENT (Only runs if input is true) ---
      
      - name: Authenticate to GCP
        if: ${{ github.event.inputs.apply_changes == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Download and run the official Google Cloud SQL Proxy binary directly
      - name: Start Cloud SQL Auth Proxy
        if: ${{ github.event.inputs.apply_changes == 'true' }}
        run: |
          # 1. Download the official proxy binary
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${{ env.PROXY_VERSION }}/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          
          # 2. Start the proxy in the background (&)
          ./cloud-sql-proxy ${{ env.INSTANCE_CONNECTION_NAME }} --port ${{ env.PROXY_PORT }} &
          
          # 3. Pause for a few seconds to let the connection establish
          sleep 3

      - name: Apply migrations to Cloud SQL
        if: ${{ github.event.inputs.apply_changes == 'true' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          atlas migrate apply \
            --url "postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:${{ env.PROXY_PORT }}/${{ secrets.DB_NAME }}?sslmode=disable" \
            --env local