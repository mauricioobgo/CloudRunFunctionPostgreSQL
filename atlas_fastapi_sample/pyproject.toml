[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-sqlmodel-sample"
version = "0.1.0"
description = "Sample FastAPI project using SQLModel for Atlas testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "atlas-provider-sqlalchemy>=0.5.0",
  "fastapi[standard]>=0.116.1,<0.117.0",
  "sqlmodel>=0.0.24,<0.0.25",
]
[tool.uv.sources]
fastapi-sqlmodel-sample = { path = "." }
